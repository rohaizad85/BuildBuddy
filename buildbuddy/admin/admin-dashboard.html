<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - BuildBuddy</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="loadingOverlay" class="loading-overlay">
        <i class="fas fa-spinner fa-spin"></i>
    </div>

    <div id="adminDashboard" style="display:none;"></div>

    <script>
        (function() {
            const user = localStorage.getItem('buildbuddy_user') || sessionStorage.getItem('buildbuddy_user');
            if (user) {
                try {
                    const userData = JSON.parse(user);
                    if (userData.role !== 'ADMIN') {
                        window.location.href = '../staff/staff-dashboard.html';
                    }
                } catch (e) {
                    window.location.href = '../auth.html';
                }
            } else {
                window.location.href = '../auth.html';
            }
        })();
    </script>

    <script type="module" src="../js/admin/admin-dashboard.js"></script>
</body>
</html>
