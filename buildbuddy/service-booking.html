<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Service - BuildBuddy</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .booking-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }
        
        .booking-card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 5px 30px rgba(0,0,0,0.1);
        }
        
        .booking-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .booking-header i {
            font-size: 48px;
            color: #00d4ff;
            margin-bottom: 15px;
        }
        
        .booking-header h2 {
            color: #1a1a2e;
            margin-bottom: 10px;
        }
        
        .service-summary {
            background: #f8f9fc;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #1a1a2e;
            font-weight: 500;
        }
        
        .form-group label i {
            margin-right: 8px;
            color: #00d4ff;
            width: 20px;
        }
        
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .btn-submit {
            width: 100%;
            padding: 16px;
            background: #00d4ff;
            color: #1a1a2e;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }
        
        .btn-submit:hover {
            background: #00b8e6;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.3);
        }
        
        .btn-submit:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="logo" onclick="window.location.href='index.html'">
                <i class="fas fa-microchip"></i>
                <h1>BuildBuddy</h1>
            </div>
            <nav class="nav">
                <a href="index.html" class="nav-link">Home</a>
                <a href="builder.html" class="nav-link">PC Builder</a>
                <a href="prebuilt.html" class="nav-link">Pre-Built PCs</a>
                <a href="service.html" class="nav-link active">Services</a>
            </nav>
            <div class="header-actions">
                <button class="cart-btn" onclick="window.location.href='cart.html'">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count">0</span>
                </button>
                <button class="login-btn" id="loginBtn">
                    <i class="fas fa-user"></i>
                    <span id="loginBtnText">Login</span>
                </button>
            </div>
        </div>
    </header>

    <main>
        <div class="booking-container">
            <div class="booking-card">
                <div class="booking-header">
                    <i class="fas fa-clipboard-list"></i>
                    <h2>Complete Your Booking</h2>
                    <p>Please provide your details for the service</p>
                </div>
                
                <div id="serviceSummary" class="service-summary"></div>
                
                <form id="bookingForm" onsubmit="handleBooking(event)">
                    <div class="form-row">
                        <div class="form-group">
                            <label><i class="fas fa-user"></i> Full Name *</label>
                            <input type="text" id="customerName" required>
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-phone"></i> Contact Phone *</label>
                            <input type="tel" id="contactPhone" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label><i class="fas fa-laptop"></i> Device Model *</label>
                        <input type="text" id="deviceModel" placeholder="e.g., Dell XPS 15, Custom PC, MacBook Pro" required>
                    </div>
                    
                    <div class="form-group">
                        <label><i class="fas fa-exclamation-circle"></i> Issue Description *</label>
                        <textarea id="deviceIssue" rows="3" placeholder="Describe the problem you're experiencing..." required></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label><i class="fas fa-map-marker-alt"></i> Address *</label>
                        <textarea id="address" rows="2" placeholder="Your full address for service" required></textarea>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label><i class="fas fa-calendar"></i> Preferred Date</label>
                            <input type="date" id="preferredDate" min="">
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-clock"></i> Preferred Time</label>
                            <select id="preferredTime">
                                <option value="">Select time (optional)</option>
                                <option value="Morning (9AM - 12PM)">Morning (9AM - 12PM)</option>
                                <option value="Afternoon (12PM - 4PM)">Afternoon (12PM - 4PM)</option>
                                <option value="Evening (4PM - 7PM)">Evening (4PM - 7PM)</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label><i class="fas fa-pen"></i> Additional Notes</label>
                        <textarea id="notes" rows="2" placeholder="Any additional information..."></textarea>
                    </div>
                    
                    <button type="submit" class="btn-submit" id="submitBtn">
                        <i class="fas fa-check"></i> Confirm Booking
                    </button>
                </form>
            </div>
        </div>
    </main>

    <script type="module" src="js/service-booking.js"></script>
</body>
</html>
