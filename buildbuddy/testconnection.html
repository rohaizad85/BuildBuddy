<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Supabase Connection Test</title>
</head>
<body>
    <h1>Supabase Connection Test v5</h1>
    <div id="results">Testing...</div>

    <script type="module">
        import supabase from '../js/supabase-client.js';
        
        const results = document.getElementById('results');
        results.innerHTML = '';
        
        function log(msg, color = '#000') {
            results.innerHTML += `<p style="color:${color}">${msg}</p>`;
        }
        
        log('<strong>Supabase client loaded</strong>', 'green');
        
        // Test 1: Simple orders
        try {
            const data = await supabase.from('service_orders').select('*').limit(3);
            log(`Test 1: Orders: ${Array.isArray(data) ? data.length + ' found ✅' : '❌'}`, Array.isArray(data) ? 'green' : 'red');
        } catch (e) {
            log(`Test 1: Orders error: ${e.message}`, 'red');
        }
        
        // Test 2: Orders with order by
        try {
            const data = await supabase.from('service_orders').select('*').order('created_at', 'desc').limit(3);
            log(`Test 2: Orders sorted: ${Array.isArray(data) ? data.length + ' found ✅' : '❌'}`, Array.isArray(data) ? 'green' : 'red');
        } catch (e) {
            log(`Test 2: Error: ${e.message}`, 'red');
        }
        
        // Test 3: Users
        try {
            const data = await supabase.from('users').select('user_id, full_name, role').limit(5);
            log(`Test 3: Users: ${Array.isArray(data) ? data.length + ' found ✅' : '❌'}`, Array.isArray(data) ? 'green' : 'red');
            if (Array.isArray(data)) {
                data.forEach(u => log(`  - ${u.full_name} (${u.role})`));
            }
        } catch (e) {
            log(`Test 3: Error: ${e.message}`, 'red');
        }
        
        // Test 4: Service table
        try {
            const data = await supabase.from('service').select('*').limit(3);
            log(`Test 4: Services: ${Array.isArray(data) ? data.length + ' found ✅' : '❌'}`, Array.isArray(data) ? 'green' : 'red');
            if (Array.isArray(data) && data.length > 0) {
                log(`  Columns: ${Object.keys(data[0]).join(', ')}`);
            }
        } catch (e) {
            log(`Test 4: Error: ${e.message}`, 'red');
        }
        
        log('<hr><strong>If tests above pass, staff-dashboard.html will work!</strong>', 'blue');
    </script>
</body>
</html>
