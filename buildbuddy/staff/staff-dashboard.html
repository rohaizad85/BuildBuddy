<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Dashboard - BuildBuddy</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .dashboard-header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            padding: 40px 0;
            margin-bottom: 40px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
            text-align: center;
        }
        
        .stat-card i {
            font-size: 32px;
            color: #00d4ff;
            margin-bottom: 15px;
        }
        
        .stat-value {
            font-size: 36px;
            font-weight: 700;
            color: #1a1a2e;
        }
        
        .stat-label {
            color: #666;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .orders-table {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
            overflow-x: auto;
        }
        
        .orders-table h3 {
            color: #1a1a2e;
            margin-bottom: 20px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th {
            text-align: left;
            padding: 15px;
            background: #f8f9fc;
            color: #1a1a2e;
            font-weight: 600;
            font-size: 14px;
        }
        
        td {
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
            font-size: 14px;
        }
        
        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }
        
        .status-PENDING { background: #fff3e0; color: #e65100; }
        .status-CONFIRMED { background: #e3f2fd; color: #1565c0; }
        .status-IN_PROGRESS { background: #f3e5f5; color: #6a1b9a; }
        .status-COMPLETED { background: #e8f5e9; color: #2e7d32; }
        .status-CANCELLED { background: #ffebee; color: #c62828; }
        
        .action-btn {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            margin-right: 5px;
            border: none;
            transition: all 0.3s;
        }
        
        .btn-update {
            background: #00d4ff;
            color: #1a1a2e;
        }
        
        .btn-update:hover {
            background: #00b8e6;
        }
        
        .filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .filter-select {
            padding: 10px 15px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="logo" onclick="window.location.href='index.html'">
                <i class="fas fa-microchip"></i>
                <h1>BuildBuddy</h1>
            </div>
            <nav class="nav">
                <a href="../index.html" class="nav-link">Home</a>
                <a href="../staff-dashboard.html" class="nav-link active">Dashboard</a>
            </nav>
            <div class="header-actions">
                <button class="login-btn" id="loginBtn">
                    <i class="fas fa-user"></i>
                    <span id="loginBtnText">Staff</span>
                </button>
            </div>
        </div>
    </header>

    <main>
        <div class="dashboard-header">
            <div class="container">
                <h1><i class="fas fa-chart-line"></i> Staff Dashboard</h1>
                <p>Manage service orders and track customer requests</p>
            </div>
        </div>

        <div class="container">
            <div class="stats-grid" id="statsGrid"></div>
            
            <div class="orders-table">
                <h3><i class="fas fa-clipboard-list"></i> Service Orders</h3>
                
                <div class="filter-bar">
                    <select class="filter-select" id="statusFilter" onchange="filterOrders()">
                        <option value="ALL">All Orders</option>
                        <option value="PENDING">Pending</option>
                        <option value="CONFIRMED">Confirmed</option>
                        <option value="IN_PROGRESS">In Progress</option>
                        <option value="COMPLETED">Completed</option>
                        <option value="CANCELLED">Cancelled</option>
                    </select>
                </div>
                
                <div id="ordersTableContainer">
                    <table>
                        <thead>
                            <tr>
                                <th>Order ID</th>
                                <th>Customer</th>
                                <th>Service</th>
                                <th>Device</th>
                                <th>Date</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="ordersTableBody">
                            <tr><td colspan="7" style="text-align: center;">Loading orders...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <div class="modal" id="updateModal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <div class="modal-header">
                <i class="fas fa-edit"></i>
                <h3>Update Order Status</h3>
            </div>
            <div class="modal-body" id="updateModalBody"></div>
        </div>
    </div>

    <script type="module" src="../js/staff/staff-dashboard.js"></script>
</body>
</html>
